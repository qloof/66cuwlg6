<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#14161A">
<title>Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14161A;
    --bg-panel: #1C1F26;
    --bg-panel-hover: #23262E;
    --ink: #E7E9ED;
    --ink-dim: #9AA1AC;
    --line: #2C3038;
    --accent: #5AA9E6;
    --accent-dim: #3A5A78;
    --radius: 6px;
    --font-body: system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: var(--font-body); line-height: 1.5; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 48px 20px 80px; }

  .eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin: 0 0 8px; }
  h1 { font-size: 1.7rem; font-weight: 600; margin: 0 0 32px; letter-spacing: -0.01em; }

  .project-list { display: flex; flex-direction: column; gap: 12px; }

  .card {
    display: block; background: var(--bg-panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px 18px; text-decoration: none; color: inherit; transition: border-color 0.15s ease, background 0.15s ease;
    cursor: pointer;
  }
  .card:hover { border-color: var(--accent); background: var(--bg-panel-hover); }
  .card h2 { font-size: 1rem; font-weight: 600; margin: 0 0 4px; color: var(--ink); }
  .card p { font-size: 0.85rem; color: var(--ink-dim); margin: 0; }

  .card-group { padding: 0; }
  .card-group summary { display: block; padding: 16px 18px; list-style: none; }
  .card-group summary::-webkit-details-marker { display: none; }
  .card-group summary::before {
    content: '▸'; display: inline-block; float: right; color: var(--accent);
    transition: transform 0.15s ease; margin-left: 8px;
  }
  .card-group[open] summary::before { transform: rotate(90deg); }
  .card-sublist { display: flex; flex-direction: column; padding: 0 18px 14px 18px; border-top: 1px solid var(--line); margin-top: 2px; }
  .sublink {
    display: block; padding: 10px 8px 10px 16px; margin-top: 4px; border-left: 2px solid var(--accent-dim);
    color: var(--ink); text-decoration: none; font-size: 0.9rem; border-radius: 4px;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .sublink:hover { background: var(--bg-panel-hover); border-color: var(--accent); }

  .empty, .error { font-family: var(--font-mono); font-size: 13px; color: var(--ink-dim); }
  .error { color: #E68A8A; }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Longfen</p>
  <h1>Projects</h1>

  <div class="project-list" id="projectList">
    <p class="empty">Loading…</p>
  </div>
</div>

<script type="module">
  const listEl = document.getElementById('projectList');

  function linkCardEl(project) {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = project.url;
    a.innerHTML = `<h2></h2><p></p>`;
    a.querySelector('h2').textContent = project.name;
    a.querySelector('p').textContent = project.description || '';
    return a;
  }

  function groupCardEl(project) {
    const details = document.createElement('details');
    details.className = 'card card-group';
    const summary = document.createElement('summary');
    summary.innerHTML = `<h2></h2><p></p>`;
    summary.querySelector('h2').textContent = project.name;
    summary.querySelector('p').textContent = project.description || '';
    details.appendChild(summary);
    const sublist = document.createElement('div');
    sublist.className = 'card-sublist';
    (project.links || []).forEach(link => {
      const a = document.createElement('a');
      a.className = 'sublink';
      a.href = link.url;
      a.textContent = link.name;
      sublist.appendChild(a);
    });
    details.appendChild(sublist);
    return details;
  }

  function renderProjects(projects) {
    listEl.innerHTML = '';
    if (!projects.length) {
      listEl.innerHTML = '<p class="empty">No projects listed yet.</p>';
      return;
    }
    projects.forEach(p => {
      if (Array.isArray(p.links)) listEl.appendChild(groupCardEl(p));
      else if (p.url) listEl.appendChild(linkCardEl(p));
      else console.warn('projects.json entry missing url/links:', p);
    });
  }

  fetch('projects.json')
    .then(res => {
      if (!res.ok) throw new Error(`projects.json: HTTP ${res.status}`);
      return res.json();
    })
    .then(projects => {
      if (!Array.isArray(projects)) throw new Error('projects.json is not an array');
      renderProjects(projects);
    })
    .catch(err => {
      listEl.innerHTML = '<p class="error">Couldn’t load the project list — check projects.json.</p>';
      console.error(err);
    });
</script>
</body>
</html>
